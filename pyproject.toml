[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portlab"
version = "0.1.0"
description = "Portfolio construction and risk, measured against a known truth"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["quantitative-finance", "portfolio-optimization", "risk-management", "value-at-risk", "covariance-estimation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: repeated fits and rolling backtests"]

[tool.ruff]
line-length = 100
target-version = "py310"
